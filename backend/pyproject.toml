# What the API is and what it needs. The dependencies are the same pins as
# requirements.txt, which stays because the local setup instructions use it;
# uv reads this file when the API is built for deployment and will not accept
# a pyproject.toml that only carries tool settings.
[project]
name = "flashcart-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "psycopg[binary]==3.2.3",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.0",
    "python-dotenv==1.0.1",
    "pyjwt==2.10.1",
    "argon2-cffi==23.1.0",
    "email-validator==2.2.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
# The crowd tests raise real threads on real connections, so they take minutes
# rather than seconds. They run by default because the guarantee they cover is
# the point of the project; `-m "not crowd"` skips them while working on
# something else.
markers = [
    "crowd: runs many shoppers at once against a real database",
]
